<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>藏品来源与返还审查</title>
<style>body{font:16px system-ui;max-width:980px;margin:32px auto;padding:0 16px}select,button{padding:8px;margin:4px}pre{background:#f4f4f4;padding:12px;white-space:pre-wrap}.panel{border:1px solid #bbb;padding:16px;border-radius:8px}</style></head>
<body><h1>藏品来源与返还审查</h1><div class="panel"><select id="user"><option>staff</option><option>reviewer1（甲馆/A）</option><option>reviewer2（乙馆/B）</option><option>claimant1</option><option>public</option></select><button onclick="load()">查看当前角色可见藏品</button><button onclick="ledger()">查看两馆对账台账</button></div><pre id="out"></pre>
<script>
function uid(){return user.value.split(/[（(]/)[0]}
async function get(url){const r=await fetch(url,{headers:{"X-User-Id":uid()}});out.textContent=`HTTP ${r.status}\n`+JSON.stringify(await r.json(),null,2)}
function load(){return get("/api/objects")}
function ledger(){return get("/api/recon/pairs")}
</script></body></html>
